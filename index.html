<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>HappyEggs - ERP Avicultura</title>
  
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" href="logo.png">

  <!-- SDKs DO FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- BIBLIOTECA PARA GERAR PDF DIRETO -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --primary: #1e293b;
      --primary-dark: #0f172a;
      --accent: #2563eb;
      --accent-light: #3b82f6;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 30px; }

    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; padding: 14px 18px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 12px rgba(15,23,42,0.25);
      border-bottom: 2px solid var(--accent);
    }
    .brand h1 { font-size: 1.15rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .user-info { font-size: 0.8rem; display: flex; align-items: center; gap: 10px; }
    .btn-logout { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
    .btn-logout:hover { background: var(--danger); border-color: var(--danger); }

    main { max-width: 580px; margin: 20px auto; padding: 0 12px; }

    .login-card {
      background: white; padding: 30px 25px; border-radius: 14px; box-shadow: 0 10px 25px rgba(15,23,42,0.12);
      max-width: 380px; margin: 50px auto; text-align: center; border: 1px solid var(--border);
    }
    .login-card h2 { color: var(--primary-dark); margin-bottom: 6px; font-size: 1.5rem; font-weight: 800; }

    .grid-menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
    .grid-btn {
      background: linear-gradient(145deg, #1e293b, #0f172a); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
      padding: 20px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(15,23,42,0.15); transition: all 0.2s ease;
    }
    .grid-btn:active { transform: scale(0.97); background: var(--primary-dark); }
    .grid-btn .icon { font-size: 2rem; }
    .grid-btn .label { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
    .grid-btn.full-width { grid-column: span 2; background: linear-gradient(145deg, #2563eb, #1d4ed8); border-color: var(--accent-light); }

    .card { background: white; border-radius: 12px; padding: 18px; border: 1px solid var(--border); margin-bottom: 15px; box-shadow: 0 2px 8px rgba(15,23,42,0.05); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    .card-title { font-size: 1rem; font-weight: 700; color: var(--primary-dark); display: flex; align-items: center; gap: 6px; }
    
    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 5px; color: var(--text-muted); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; background: #f8fafc; }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); outline: none; background: #fff; }

    .btn { background: var(--accent); color: white; border: none; padding: 12px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 0.9rem; text-align: center; text-decoration: none; display: inline-block; transition: 0.2s; }
    .btn:hover { background: var(--accent-light); }
    .btn-back { background: #475569; padding: 6px 12px; width: auto; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 4px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid #e2e8f0; word-break: break-word; }
    th { background: #f8fafc; color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 0.75rem; }

    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15,23,42,0.7); align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(3px); }
    .modal-content { background: white; width: 92%; max-width: 480px; border-radius: 12px; padding: 22px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
    
    .receipt-box { 
      border: 1px dashed #000; 
      padding: 16px; 
      font-family: 'Courier New', monospace; 
      font-size: 0.85rem; 
      background: #fff; 
      margin-bottom: 12px; 
      color: #000;
      text-align: left;
      width: 100%;
      word-wrap: break-word;
      box-sizing: border-box;
    }

    /* REGRAS DE IMPRESSÃO (AJUSTADAS PARA 1 PÁGINA A4) */
    @media print {
      @page { size: A4 portrait; margin: 5mm; }
      body * { visibility: hidden !important; }
      body { background: #fff !important; padding: 0 !important; margin: 0 !important; }
      #modal-nota, #modal-nota * { visibility: visible !important; }
      #modal-nota { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; background: #fff !important; display: block !important; }
      .modal-content { box-shadow: none !important; padding: 0 !important; margin: 0 !important; width: 100% !important; max-width: 100% !important; }
      #printable-receipt { border: none !important; padding: 8px !important; margin: 0 !important; page-break-inside: avoid !important; }
      .modal button, .card-title { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO -->
  <header id="app-header" style="display:none;">
    <div class="brand"><span id="header-title">🥚 HAPPY EGGS</span></div>
    <div class="user-info">
      <span id="user-display">👤 Admin</span>
      <button class="btn-logout" type="button" onclick="logout()">Sair</button>
    </div>
  </header>

  <main>
    <!-- TELA DE LOGIN -->
    <div id="view-login" class="login-card">
      <h2>HAPPY EGGS</h2>
      <p style="font-size:0.8rem; color:#64748b; margin-bottom: 25px;">Gestão de Avicultura</p>
      <form onsubmit="autenticar(event)">
        <div class="form-group"><label>Usuário</label><input type="text" id="login-user" placeholder="Seu usuário" required autocomplete="username"></div>
        <div class="form-group"><label>Senha</label><input type="password" id="login-pass" placeholder="Sua senha" required autocomplete="current-password"></div>
        <button type="submit" class="btn" style="margin-top:10px;">Entrar no Sistema</button>
      </form>
    </div>

    <!-- MENU PRINCIPAL (DASHBOARD) -->
    <div id="view-dashboard" style="display:none;">
      <div class="grid-menu">
        <button class="grid-btn full-width" type="button" onclick="navTo('pedidos')">
          <span class="icon">🛒</span><span class="label">NOVO PEDIDO / VENDAS</span>
        </button>
        <button class="grid-btn" type="button" onclick="navTo('clientes')"><span class="icon">👥</span><span class="label">CLIENTES</span></button>
        <button class="grid-btn" type="button" onclick="navTo('produtos')"><span class="icon">📦</span><span class="label">ESTOQUE</span></button>
        <button class="grid-btn admin-only" type="button" onclick="navTo('usuarios')"><span class="icon">🔑</span><span class="label">USUÁRIOS</span></button>
        <button class="grid-btn admin-only" type="button" onclick="navTo('empresa')"><span class="icon">⚙️</span><span class="label">EMPRESA</span></button>
      </div>
    </div>

    <!-- TELA: CLIENTES -->
    <div id="view-clientes" class="view-content" style="display:none;">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Cadastrar Cliente</div>
          <button class="btn btn-back" type="button" onclick="navTo('dashboard')">🏠 Início</button>
        </div>
        <form onsubmit="cadastrarCliente(event)">
          <div class="form-group"><label>Nome / Razão Social</label><input type="text" id="cli-nome" required></div>
          <div class="form-group"><label>Documento (CPF / CNPJ)</label><input type="text" id="cli-doc"></div>
          <div class="form-group"><label>WhatsApp / Telefone</label><input type="tel" id="cli-tel" required></div>
          <div class="form-group"><label>Endereço Completo</label><input type="text" id="cli-end" required></div>
          <button type="submit" class="btn">Salvar Cliente na Nuvem</button>
        </form>
      </div>
      <div class="card">
        <div class="card-title">Clientes Cadastrados</div>
        <table>
          <thead><tr><th>Nome / Doc</th><th>Contato</th></tr></thead>
          <tbody id="lista-clientes"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    // ⚠️ IMPORTANTE: RESTAURE AQUI AS CREDENCIAIS DO BANCO DE DADOS DA SUA EMPRESA ORIGINAL!
    const firebaseConfig = {
      apiKey: "SUA_API_KEY_ORIGINAL",
      authDomain: "SEU_PROJECT_ID.firebaseapp.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_PROJECT_ID.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let state = {
      usuarios: [],
      produtos: [],
      clientes: [],
      pedidos: [],
      currentUser: null,
      listenersUnsubscribe: []
    };

    function initListeners() {
      state.listenersUnsubscribe.forEach(unsub => unsub());
      state.listenersUnsubscribe = [];

      // Carrega diretamente sem filtrar por empresaId
      const unsubClientes = db.collection("clientes").onSnapshot(snapshot => {
        state.clientes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderClientes();
      });

      const unsubProdutos = db.collection("produtos").onSnapshot(snapshot => {
        state.produtos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      });

      state.listenersUnsubscribe.push(unsubClientes, unsubProdutos);
    }

    async function autenticar(e) {
      e.preventDefault();
      const u = document.getElementById('login-user').value.trim().toLowerCase();
      const p = document.getElementById('login-pass').value.trim();
      
      try {
        // Tenta buscar o usuário no Firestore
        const snapshot = await db.collection("usuarios").where("login", "==", u).get();

        // Se a coleção de usuários estiver vazia e a pessoa tentar entrar com admin/1234, cria automaticamente
        if (snapshot.empty) {
          if (u === 'admin' && p === '1234') {
            const newAdmin = { login: 'admin', pass: '1234', role: 'admin' };
            const docRef = await db.collection("usuarios").add(newAdmin);
            state.currentUser = { id: docRef.id, ...newAdmin };
            entrarNoSistema(state.currentUser);
            return;
          } else {
            return alert('Usuário ou senha incorretos! (Para criar o 1º acesso, use usuário: admin e senha: 1234)');
          }
        }

        const userDoc = snapshot.docs[0];
        const found = { id: userDoc.id, ...userDoc.data() };

        if (found.pass !== p) {
          return alert('Usuário ou senha incorretos!');
        }

        state.currentUser = found;
        entrarNoSistema(found);

      } catch (err) {
        if (err.code === 'permission-denied') {
          alert('Erro de Permissão no Firebase: Acesse o Firebase Console > Firestore Database > Regras (Rules) e libere a leitura/escrita.');
        } else {
          alert('Erro ao realizar login: ' + err.message);
        }
      }
    }

    function entrarNoSistema(user) {
      document.getElementById('view-login').style.display = 'none';
      document.getElementById('app-header').style.display = 'flex';
      document.getElementById('user-display').innerText = `👤 ${user.login.toUpperCase()}`;
      
      initListeners();
      navTo('dashboard');
    }

    function logout() {
      state.listenersUnsubscribe.forEach(unsub => unsub());
      state.listenersUnsubscribe = [];
      state.currentUser = null;
      document.getElementById('app-header').style.display = 'none';
      document.querySelectorAll('.view-content').forEach(v => v.style.display = 'none');
      document.getElementById('view-dashboard').style.display = 'none';
      document.getElementById('view-login').style.display = 'block';
    }

    function navTo(screen) {
      document.getElementById('view-dashboard').style.display = 'none';
      document.querySelectorAll('.view-content').forEach(v => v.style.display = 'none');
      if (screen === 'dashboard') document.getElementById('view-dashboard').style.display = 'block';
      else {
        const targetView = document.getElementById(`view-${screen}`);
        if (targetView) targetView.style.display = 'block';
        else alert('Tela em desenvolvimento.');
      }
    }

    function cadastrarCliente(e) {
      e.preventDefault();
      const novoCliente = {
        nome: document.getElementById('cli-nome').value.trim(),
        doc: document.getElementById('cli-doc').value.trim(),
        tel: document.getElementById('cli-tel').value.trim(),
        end: document.getElementById('cli-end').value.trim()
      };

      db.collection("clientes").add(novoCliente).then(() => {
        alert('Cliente cadastrado com sucesso!');
        e.target.reset();
      }).catch(err => alert('Erro ao cadastrar cliente: ' + err.message));
    }

    function renderClientes() {
      const tbody = document.getElementById('lista-clientes');
      if (!tbody) return;
      tbody.innerHTML = state.clientes.map(c => `
        <tr>
          <td><b>${c.nome}</b><br><small>${c.doc || '-'}</small></td>
          <td>${c.tel}</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
